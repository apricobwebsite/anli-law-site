# 推送到 main 時自動 build site/ 並部署到 Cloudflare Pages（專案 anli-law-site）。
# 使用前（一次性）：在 repo 設定兩個 secrets——
#   CLOUDFLARE_ACCOUNT_ID：Cloudflare 帳號 ID
#   CLOUDFLARE_API_TOKEN：具「Account → Cloudflare Pages → Edit」權限的 API Token
name: Deploy site to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: site
      - name: Build
        run: npm run build
        working-directory: site
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=anli-law-site --branch=main
